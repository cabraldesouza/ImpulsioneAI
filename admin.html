<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ImpulsioneAI · Painel</title>
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ImpulsioneAI — Painel administrativo
   Mesma linguagem visual do site: Inter, #FAFAF8, cards #FFF, texto #111,
   secundário #666, bordas #ECECEC, hover #F5F5F3, destaque #111 e azul #1F6FEB.
   Tudo em um arquivo. Persistência via LocalStorage. Sem frameworks.
   ===================================================================== */

:root{
  --bg:#FAFAF8; --card:#FFFFFF; --ink:#111111; --muted:#666666;
  --line:#ECECEC; --hover:#F5F5F3; --blue:#1F6FEB; --navy:#0F172A;
  --ease:cubic-bezier(.16,1,.3,1);
  --r:14px; --r-sm:10px;
  --sb:248px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--navy);color:#fff;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#E4E4E1;border-radius:8px;border:3px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:#d8d8d4;}

/* ---------- utilidades ---------- */
.muted{color:var(--muted);}
.mono{font-variant-numeric:tabular-nums;}
.hide{display:none !important;}
.fade-in{animation:fadeUp .5s var(--ease) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:600;transition:background .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease);white-space:nowrap;}
.btn:hover{background:var(--hover);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-primary:hover{background:#000;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--hover);}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px;}
.btn-icon{width:38px;padding:0;justify-content:center;}
.btn-danger:hover{background:#FCEDED;border-color:#F3C9C9;color:#B42318;}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;}
#login .box{width:100%;max-width:380px;animation:fadeUp .6s var(--ease) both;}
#login .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em;margin-bottom:28px;}
#login .brand img{height:28px;}
#login h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px;}
#login p{color:var(--muted);font-size:14px;margin:0 0 26px;}
#login .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px rgba(15,23,42,.06);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;}
.field input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);transition:border-color .2s var(--ease),background .2s var(--ease);}
.field input:focus{outline:none;border-color:var(--ink);background:#fff;}
#login .err{color:#B42318;font-size:12.5px;margin:-6px 0 14px;min-height:16px;}
#login .btn-primary{width:100%;height:46px;justify-content:center;font-size:14.5px;}
#login .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:20px;}

/* ---------- shell ---------- */
#app{min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;z-index:40;}
.sidebar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px;letter-spacing:-.02em;padding:6px 8px 20px;}
.sidebar .brand img{height:24px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:var(--r-sm);color:var(--muted);font-size:14px;font-weight:600;transition:background .2s var(--ease),color .2s var(--ease);}
.nav a:hover{background:var(--hover);color:var(--ink);}
.nav a.active{background:var(--navy);color:#fff;}
.nav a.active svg{color:#fff;}
.nav svg{width:18px;height:18px;flex-shrink:0;color:currentColor;}
.sidebar .spacer{flex:1;}
.sidebar .who{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line);margin-top:12px;}
.sidebar .who .av{width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.sidebar .who .meta{line-height:1.25;}
.sidebar .who .meta b{font-size:13px;}
.sidebar .who .meta span{font-size:11px;color:var(--muted);}

.main{margin-left:var(--sb);min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:16px clamp(20px,4vw,40px);background:rgba(250,250,248,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
.topbar h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.topbar .grow{flex:1;}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);min-width:200px;transition:border-color .2s var(--ease);}
.search:focus-within{border-color:var(--ink);}
.search input{border:none;background:none;outline:none;width:100%;}
.search svg{width:16px;height:16px;color:var(--muted);}
.content{padding:clamp(20px,4vw,40px);max-width:1400px;width:100%;margin:0 auto;flex:1;}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;}
.kpi{transition:transform .25s var(--ease),box-shadow .25s var(--ease);}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(15,23,42,.06);}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:12px;}
.kpi .chg{font-size:11.5px;font-weight:600;margin-top:6px;color:var(--muted);}
.kpi .chg.up{color:var(--blue);}
.kpi .chg.down{color:#B42318;}
.section-title{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:36px 0 16px;}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.chart-head h3{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em;}
.chart-head span{font-size:11.5px;color:var(--muted);}
canvas{display:block;width:100%;}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;}
.tl .row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.tl .row:last-child{border-bottom:none;}
.tl .dot{width:8px;height:8px;border-radius:50%;background:var(--navy);margin-top:6px;flex-shrink:0;}
.tl .dot.blue{background:var(--blue);}
.tl .dot.gray{background:var(--line);}
.tl .t{font-size:13.5px;font-weight:600;}
.tl .d{font-size:12px;color:var(--muted);margin-top:2px;}
.tl .when{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;}

/* ---------- tabela ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.toolbar .grow{flex:1;}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:100px;background:var(--card);font-size:12.5px;font-weight:600;color:var(--muted);transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);}
.pill:hover{background:var(--hover);color:var(--ink);}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
select.input,input.input,textarea.input{width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);transition:border-color .2s var(--ease),background .2s var(--ease);}
select.input:focus,input.input:focus,textarea.input:focus{outline:none;border-color:var(--ink);background:#fff;}
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--ink);}
thead th .ar{opacity:.4;font-size:10px;}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tbody tr{transition:background .15s var(--ease);}
tbody tr:hover{background:var(--hover);}
tbody tr:last-child td{border-bottom:none;}
.cell-strong{font-weight:600;}
.rowactions{display:flex;gap:4px;opacity:0;transition:opacity .2s var(--ease);}
tbody tr:hover .rowactions{opacity:1;}
.ico{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid transparent;color:var(--muted);transition:background .18s var(--ease),color .18s var(--ease);}
.ico:hover{background:var(--hover);color:var(--ink);}
.ico svg{width:15px;height:15px;}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:100px;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:var(--bg);}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.green{color:#127A45;background:#EAF7EF;border-color:#CBEBD8;}
.badge.gray{color:#666;background:#F3F3F1;border-color:var(--line);}
.badge.red{color:#B42318;background:#FCEDED;border-color:#F3C9C9;}
.badge.blue{color:#1F5FBF;background:#EEF4FE;border-color:#D3E3FB;}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin:0 4px 4px 0;}
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);}
.pager .pg{display:flex;gap:6px;}

/* ---------- kanban ---------- */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
.col{flex:0 0 288px;background:transparent;}
.col .col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px;}
.col .col-h b{font-size:13px;font-weight:700;}
.col .col-h .cnt{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:100px;padding:1px 8px;}
.col .drop{display:flex;flex-direction:column;gap:10px;min-height:60px;padding:6px;border-radius:var(--r);border:1px dashed transparent;transition:border-color .2s var(--ease),background .2s var(--ease);}
.col .drop.over{border-color:var(--blue);background:#F4F8FF;}
.lead{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;cursor:grab;transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease);}
.lead:hover{box-shadow:0 8px 22px rgba(15,23,42,.07);transform:translateY(-1px);}
.lead.dragging{opacity:.5;}
.lead b{font-size:13.5px;}
.lead .l-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.lead .l-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.lead .l-val{font-size:13px;font-weight:700;}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(17,17,17,.28);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;opacity:0;pointer-events:none;transition:opacity .22s var(--ease);overflow-y:auto;}
.overlay.show{opacity:1;pointer-events:auto;}
.modal{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(15,23,42,.22);transform:translateY(14px) scale(.99);opacity:0;transition:transform .26s var(--ease),opacity .26s var(--ease);margin:auto;}
.overlay.show .modal{transform:none;opacity:1;}
.modal.lg{max-width:720px;}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line);}
.modal-h h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;}
.modal-b{padding:24px;}
.modal-f{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:18px 24px;border-top:1px solid var(--line);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid .full{grid-column:1/-1;}
.form-grid label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;}

/* ---------- toast ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:400;display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:var(--r-sm);padding:12px 16px;font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(15,23,42,.25);transform:translateY(12px);opacity:0;transition:transform .28s var(--ease),opacity .28s var(--ease);max-width:340px;}
.toast.show{transform:none;opacity:1;}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.toast.ok .dot{background:#3ECf8e;}
.toast.err .dot{background:#ff6b6b;}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:60px 20px;}
.empty .ill{width:76px;height:76px;margin:0 auto 18px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#FAFAF8);display:flex;align-items:center;justify-content:center;position:relative;}
.empty .ill::before{content:"";width:30px;height:4px;border-radius:3px;background:var(--line);box-shadow:0 10px 0 var(--line),0 -10px 0 #E4E4E1;}
.empty h4{font-size:16px;font-weight:700;margin:0 0 6px;}
.empty p{color:var(--muted);font-size:13.5px;margin:0 0 18px;}

/* ---------- financeiro ---------- */
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);}
.fin-row:last-child{border-bottom:none;}
.fin-row .fi{display:flex;align-items:center;gap:12px;}
.fin-row .fi .ic{width:34px;height:34px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);}
.amount.pos{color:#127A45;font-weight:700;}
.amount.neg{color:#B42318;font-weight:700;}

/* ---------- mobile ---------- */
.bottombar{display:none;}
@media(max-width:900px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .content{padding-bottom:96px;}
  .form-grid{grid-template-columns:1fr;}
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;}
  .bottombar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:10px;transition:color .2s var(--ease),background .2s var(--ease);}
  .bottombar a.active{color:var(--ink);}
  .bottombar a.active svg{color:var(--ink);}
  .bottombar svg{width:20px;height:20px;color:var(--muted);}
  .topbar{padding:14px 20px;}
  .topbar h2{font-size:17px;}
  .search{min-width:0;}
}
@media(max-width:560px){
  .topbar .search{display:none;}
}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="login">
  <div class="box">
    <div class="brand"><img src="logo-icone.png" alt=""> ImpulsioneAI</div>
    <h1>Painel administrativo</h1>
    <p>Acesso restrito. Entre com suas credenciais.</p>
    <div class="card">
      <form id="loginForm">
        <div class="field">
          <label>Usuário</label>
          <input id="lgUser" type="text" autocomplete="username" placeholder="usuário" autofocus>
        </div>
        <div class="field">
          <label>Senha</label>
          <input id="lgPass" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="err" id="lgErr"></div>
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
    </div>
    <div class="foot">ImpulsioneAI · Painel interno</div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="hide">
  <aside class="sidebar">
    <div class="brand"><img src="logo-icone.png" alt=""> ImpulsioneAI</div>
    <nav class="nav" id="navDesk"></nav>
    <div class="spacer"></div>
    <div class="who">
      <div class="av" id="avatar">E</div>
      <div class="meta"><b id="whoName">empresa</b><br><span>Administrador</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub">Visão geral do negócio</div>
      </div>
      <div class="grow"></div>
      <div class="search" id="globalSearchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="globalSearch" placeholder="Buscar…">
      </div>
      <button class="btn btn-ghost btn-icon" id="btnLogout" title="Sair">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </header>
    <main class="content" id="view"></main>
  </div>

  <nav class="bottombar" id="navMob"></nav>
</div>

<div id="toasts"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
/* ===================================================================== *
 *  ImpulsioneAI Painel — app.js (embutido)
 *  Organizado em módulos: Utils, Store, Auth, Toast, Modal, Charts,
 *  Dashboard, Clientes, Leads, Financeiro, Config, App(Router).
 * ===================================================================== */

/* ------------------------------------------------------------------ *
 * UTILS — helpers puros, sem estado.
 * ------------------------------------------------------------------ */
const Utils = (() => {
  const $  = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const el = (tag, attrs={}, html) => {
    const n = document.createElement(tag);
    for (const k in attrs){
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    if (html != null) n.innerHTML = html;
    return n;
  };
  const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const money = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const num = v => (Number(v)||0).toLocaleString('pt-BR');
  const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const debounce = (fn,ms=200)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
  const fmtDate = d => { if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return '—'; return x.toLocaleDateString('pt-BR'); };
  const monthKey = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); };
  const monthLabel = i => ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][i];
  const last12 = () => { const a=[]; const now=new Date(); for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);a.push({key:monthKey(d),label:monthLabel(d.getMonth()),date:d});} return a; };
  async function sha256(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  const download = (name, text, type='text/plain') => {
    const blob = new Blob([text], {type}); const url = URL.createObjectURL(blob);
    const a = el('a',{href:url, download:name}); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 500);
  };
  return {$,$$,el,uid,money,num,esc,debounce,fmtDate,monthKey,monthLabel,last12,sha256,download};
})();

 * STORE — estado + persistência LocalStorage + autosave.
 * ------------------------------------------------------------------ */
const Store = (() => {
  const KEY = 'impulsioneai_admin_v2';
  const AUTH = 'impulsioneai_admin_auth';
  let db = null;

  // Banco inicial LIMPO — começa vazio, pronto para uso real.
  const seed = () => ({
    clientes: [],
    leads: [],
    pagamentos: [],
    config:{ agencia:'ImpulsioneAI', whatsapp:'5562992150455', email:'impulsioneaibr@gmail.com', setupPadrao:3500 },
    meta:{
      etapas:['Novo','Contato iniciado','Reunião marcada','Proposta enviada','Negociação','Fechado','Perdido'],
      origem:['Indicação','Instagram','Google','WhatsApp','Site'],
      criadoEm:new Date().toISOString()
    }
  });

  const load = () => {
    try{ const raw = localStorage.getItem(KEY); db = raw ? JSON.parse(raw) : seed(); }
    catch(e){ db = seed(); }
    if(!db.meta) db.meta = seed().meta;
    return db;
  };
  const save = Utils.debounce(() => { localStorage.setItem(KEY, JSON.stringify(db)); }, 250);
  const saveNow = () => localStorage.setItem(KEY, JSON.stringify(db));
  const get = () => db || load();
  const replace = (obj) => { db = obj; saveNow(); };
  const reset = () => { db = seed(); saveNow(); };

  // sessão de autenticação
  const isAuthed = () => sessionStorage.getItem(AUTH) === '1';
  const setAuthed = v => v ? sessionStorage.setItem(AUTH,'1') : sessionStorage.removeItem(AUTH);

  return {load,save,saveNow,get,replace,reset,isAuthed,setAuthed,KEY,AUTH};
})();

/* ------------------------------------------------------------------ *
 * MODAL — abertura/fechamento suave + confirmação.
 * ------------------------------------------------------------------ */
const Modal = (() => {
  const ov = () => Utils.$('#overlay');
  const box = () => Utils.$('#modal');
  let onClose = null;
  const open = (html, {size=''}={}) => {
    box().className = 'modal '+size;
    box().innerHTML = html;
    ov().classList.add('show');
    document.body.style.overflow='hidden';
    const first = box().querySelector('input,select,textarea,button');
    if(first) setTimeout(()=>first.focus(),120);
  };
  const close = () => { ov().classList.remove('show'); document.body.style.overflow=''; if(onClose){onClose();onClose=null;} };
  const confirm = (title, msg, {danger=false, okText='Confirmar'}={}) => new Promise(res=>{
    open(`
      <div class="modal-h"><h3>${Utils.esc(title)}</h3>
        <button class="ico" data-x>${IconSet.x}</button></div>
      <div class="modal-b"><p class="muted" style="margin:0;line-height:1.6">${Utils.esc(msg)}</p></div>
      <div class="modal-f">
        <button class="btn" data-no>Cancelar</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" data-yes>${Utils.esc(okText)}</button>
      </div>`);
    box().querySelector('[data-yes]').onclick=()=>{close();res(true);};
    box().querySelector('[data-no]').onclick=()=>{close();res(false);};
    box().querySelector('[data-x]').onclick=()=>{close();res(false);};
  });
  // fechar clicando fora / ESC
  document.addEventListener('click', e=>{ if(e.target===ov()) close(); });
  return {open,close,confirm};
})();

/* ------------------------------------------------------------------ *
 * CHARTS — gráficos em Canvas puro (sem libs). Alta densidade (dpr).
 * ------------------------------------------------------------------ */
const Charts = (() => {
  const setup = (canvas, h=180) => {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || canvas.parentElement.clientWidth;
    canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.height = h+'px';
    const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
    return {ctx,w,h};
  };
  const bars = (canvas, data, {color='#0F172A', accent='#1F6FEB'}={}) => {
    const {ctx,w,h} = setup(canvas);
    const pad={t:12,r:6,b:22,l:6}; const iw=w-pad.l-pad.r; const ih=h-pad.t-pad.b;
    const max = Math.max(1, ...data.map(d=>d.v));
    const bw = iw/data.length; const bar = Math.min(26, bw*0.55);
    ctx.clearRect(0,0,w,h);
    data.forEach((d,i)=>{
      const x = pad.l + i*bw + (bw-bar)/2;
      const bh = Math.max(2, (d.v/max)*ih);
      const y = pad.t + ih - bh;
      ctx.fillStyle = i===data.length-1 ? accent : color;
      const r=Math.min(4,bar/2);
      ctx.beginPath();
      ctx.moveTo(x,y+bh); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
      ctx.lineTo(x+bar-r,y); ctx.arcTo(x+bar,y,x+bar,y+r,r); ctx.lineTo(x+bar,y+bh);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#999'; ctx.font='10px Inter'; ctx.textAlign='center';
      ctx.fillText(d.l, x+bar/2, h-7);
    });
  };
  const line = (canvas, data, {color='#0F172A', fill=true, dots=true}={}) => {
    const {ctx,w,h} = setup(canvas);
    const pad={t:14,r:8,b:22,l:8}; const iw=w-pad.l-pad.r; const ih=h-pad.t-pad.b;
    const max = Math.max(1, ...data.map(d=>d.v)); const min = Math.min(0, ...data.map(d=>d.v));
    const X = i => pad.l + (iw/(Math.max(1,data.length-1)))*i;
    const Y = v => pad.t + ih - ((v-min)/(max-min||1))*ih;
    ctx.clearRect(0,0,w,h);
    // linha base
    ctx.strokeStyle='#EFEFED'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad.l,pad.t+ih); ctx.lineTo(pad.l+iw,pad.t+ih); ctx.stroke();
    if(fill){
      const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ih);
      g.addColorStop(0,'rgba(31,111,235,.14)'); g.addColorStop(1,'rgba(31,111,235,0)');
      ctx.beginPath(); ctx.moveTo(X(0),Y(data[0].v));
      data.forEach((d,i)=>ctx.lineTo(X(i),Y(d.v)));
      ctx.lineTo(X(data.length-1),pad.t+ih); ctx.lineTo(X(0),pad.t+ih); ctx.closePath();
      ctx.fillStyle=g; ctx.fill();
    }
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin='round';
    ctx.beginPath(); data.forEach((d,i)=> i?ctx.lineTo(X(i),Y(d.v)):ctx.moveTo(X(i),Y(d.v))); ctx.stroke();
    if(dots){ const i=data.length-1; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(X(i),Y(data[i].v),3.5,0,7); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(X(i),Y(data[i].v),1.4,0,7); ctx.fill(); }
    ctx.fillStyle='#999'; ctx.font='10px Inter'; ctx.textAlign='center';
    data.forEach((d,i)=>{ if(data.length<=12 || i%2===0) ctx.fillText(d.l, X(i), h-7); });
  };
  return {bars,line};
})();

/* ------------------------------------------------------------------ *
 * METRICS — cálculos de negócio a partir do Store.
 * ------------------------------------------------------------------ */
const Metrics = (() => {
  const ativos = () => Store.get().clientes.filter(c=>c.status==='Ativo');
  const mrr = () => ativos().reduce((s,c)=>s+(+c.mensalidade||0),0);
  const custos = () => ativos().reduce((s,c)=>s+(+c.custo||0),0);
  const setupsTotal = () => Store.get().clientes.reduce((s,c)=>s+(+c.valorSetup||0),0);
  const leadsAbertos = () => Store.get().leads.filter(l=>l.etapa!=='Fechado'&&l.etapa!=='Perdido').length;
  const conversao = () => { const L=Store.get().leads; if(!L.length) return 0; return Math.round(L.filter(l=>l.etapa==='Fechado').length / L.length * 100); };
  // séries mensais (12m)
  const serie = (fn) => Utils.last12().map(m=>({l:m.label, v:fn(m.key)}));
  const faturamentoMensal = () => serie(k => Store.get().pagamentos.filter(p=>p.tipo==='receita'&&Utils.monthKey(p.data)===k).reduce((s,p)=>s+(+p.valor||0),0));
  const novosClientes = () => serie(k => Store.get().clientes.filter(c=>Utils.monthKey(c.dataFechamento)===k).length);
  const conversaoMensal = () => serie(k => { const L=Store.get().leads.filter(l=>Utils.monthKey(l.criadoEm)===k); if(!L.length) return 0; return Math.round(L.filter(l=>l.etapa==='Fechado').length/L.length*100); });
  const mrrMensal = () => serie(k => Store.get().pagamentos.filter(p=>p.categoria==='recorrente'&&p.tipo==='receita'&&Utils.monthKey(p.data)===k).reduce((s,p)=>s+(+p.valor||0),0));
  const fluxoCaixa = () => Utils.last12().map(m=>({l:m.label, v:
    Store.get().pagamentos.filter(p=>Utils.monthKey(p.data)===m.key).reduce((s,p)=>s+(p.tipo==='receita'?(+p.valor):-(+p.valor)),0)}));
  return {ativos,mrr,custos,setupsTotal,leadsAbertos,conversao,faturamentoMensal,novosClientes,conversaoMensal,mrrMensal,fluxoCaixa};
})();

    </div>`;

  const form = (c={}) => {
    const isEdit = !!c.id;
    Modal.open(`
      <div class="modal-h"><h3>${isEdit?'Editar cliente':'Novo cliente'}</h3><button class="ico" data-x>${IconSet.x}</button></div>
      <div class="modal-b"><form id="cForm"><div class="form-grid">
        <div class="full"><label>Empresa *</label><input class="input" name="empresa" required value="${Utils.esc(c.empresa||'')}"></div>
        <div><label>Contato</label><input class="input" name="contato" value="${Utils.esc(c.contato||'')}"></div>
        <div><label>Telefone (WhatsApp)</label><input class="input" name="telefone" value="${Utils.esc(c.telefone||'')}" placeholder="55DDDNÚMERO"></div>
        <div><label>Email</label><input class="input" type="email" name="email" value="${Utils.esc(c.email||'')}"></div>
        <div><label>Nicho</label><input class="input" name="nicho" value="${Utils.esc(c.nicho||'')}"></div>
        <div><label>Tipo</label><select class="input" name="tipo">${TIPOS.map(t=>`<option ${c.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label>Status</label><select class="input" name="status">${STATUS.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Valor de setup (R$)</label><input class="input" type="number" step="0.01" name="valorSetup" value="${c.valorSetup??''}"></div>
        <div><label>Mensalidade (R$)</label><input class="input" type="number" step="0.01" name="mensalidade" value="${c.mensalidade??''}"></div>
        <div><label>Custo mensal (R$)</label><input class="input" type="number" step="0.01" name="custo" value="${c.custo??''}"></div>
        <div><label>Data de fechamento</label><input class="input" type="date" name="dataFechamento" value="${c.dataFechamento?c.dataFechamento.slice(0,10):''}"></div>
        <div class="full"><label>URL do site</label><input class="input" name="url" value="${Utils.esc(c.url||'')}" placeholder="https://"></div>
        <div class="full"><label>Tags (separadas por vírgula)</label><input class="input" name="tags" value="${Utils.esc((c.tags||[]).join(', '))}"></div>
        <div class="full"><label>Observações</label><textarea class="input" name="obs" rows="3">${Utils.esc(c.obs||'')}</textarea></div>
      </div></form></div>
      <div class="modal-f"><button class="btn" data-x>Cancelar</button><button class="btn btn-primary" id="cSave">${isEdit?'Salvar alterações':'Cadastrar'}</button></div>
    `,{size:'lg'});
    Utils.$$('[data-x]').forEach(b=>b.onclick=Modal.close);
    const submit = () => {
      const f = Utils.$('#cForm'); if(!f.reportValidity()) return;
      const fd = new FormData(f); const o = Object.fromEntries(fd.entries());
      o.tags = o.tags ? o.tags.split(',').map(t=>t.trim()).filter(Boolean) : [];
      ['valorSetup','mensalidade','custo'].forEach(k=>o[k]=+o[k]||0);
      o.dataFechamento = o.dataFechamento ? new Date(o.dataFechamento).toISOString() : (c.dataFechamento||'');
      const db = Store.get();
      if(isEdit){ Object.assign(db.clientes.find(x=>x.id===c.id), o); Toast.ok('Cliente atualizado'); }
      else { o.id=Utils.uid(); db.clientes.push(o); Toast.ok('Cliente cadastrado'); }
      Store.saveNow(); Modal.close(); render();
    };
    Utils.$('#cSave').onclick = submit;
    Utils.$('#cForm').addEventListener('submit',e=>{e.preventDefault();submit();});
  };

  const bind = () => {
    const s=Utils.$('#cSearch'); if(s){ s.oninput=Utils.debounce(e=>{q=e.target.value;page=1;render();},180); s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
    Utils.$$('[data-status]').forEach(b=>b.onclick=()=>{statusF=b.dataset.status;page=1;render();});
    Utils.$$('[data-tipo]').forEach(b=>b.onclick=()=>{tipoF=b.dataset.tipo;page=1;render();});
    Utils.$$('thead th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort; if(sortK===k)sortDir*=-1; else{sortK=k;sortDir=1;} render();});
    const add=()=>form(); const a1=Utils.$('#cAdd'),a2=Utils.$('#cAdd2'); if(a1)a1.onclick=add; if(a2)a2.onclick=add;
    Utils.$$('[data-edit]').forEach(b=>b.onclick=()=>form(Store.get().clientes.find(c=>c.id===b.dataset.edit)));
    Utils.$$('[data-dup]').forEach(b=>b.onclick=()=>{const c=Store.get().clientes.find(x=>x.id===b.dataset.dup);const cp={...c,id:Utils.uid(),empresa:c.empresa+' (cópia)',tags:[...(c.tags||[])]};Store.get().clientes.push(cp);Store.saveNow();Toast.ok('Cliente duplicado');render();});
    Utils.$$('[data-del]').forEach(b=>b.onclick=async()=>{const c=Store.get().clientes.find(x=>x.id===b.dataset.del);if(await Modal.confirm('Excluir cliente',`Remover "${c.empresa}"? Esta ação não pode ser desfeita.`,{danger:true,okText:'Excluir'})){const db=Store.get();db.clientes=db.clientes.filter(x=>x.id!==c.id);Store.saveNow();Toast.ok('Cliente excluído');render();}});
    Utils.$$('[data-pg]').forEach(b=>b.onclick=()=>{page+=b.dataset.pg==='next'?1:-1;render();});
    const ex=Utils.$('#cExport'); if(ex)ex.onclick=exportCSV;
    const im=Utils.$('#cImport'); if(im)im.onclick=importCSV;
  };

  const FIELDS = ['empresa','contato','telefone','email','nicho','tipo','valorSetup','mensalidade','custo','status','dataFechamento','url','obs','tags'];
  const exportCSV = () => {
    const rows = [FIELDS.join(',')].concat(Store.get().clientes.map(c=>FIELDS.map(f=>{
      let v = f==='tags' ? (c.tags||[]).join('; ') : (c[f]??'');
      v = String(v).replace(/"/g,'""'); return /[",\n]/.test(v)?`"${v}"`:v;
    }).join(',')));
    Utils.download('clientes-impulsioneai.csv', rows.join('\n'), 'text/csv');
    Toast.ok('CSV exportado');
  };
  const importCSV = () => {
    const inp = Utils.el('input',{type:'file',accept:'.csv'});
    inp.onchange = () => { const file=inp.files[0]; if(!file) return; const r=new FileReader();
      r.onload=()=>{ try{
        const lines = r.result.split(/\r?\n/).filter(Boolean); const head = lines.shift().split(',').map(h=>h.trim());
        let n=0; lines.forEach(line=>{ const cells=parseCSVLine(line); const o={}; head.forEach((h,i)=>o[h]=cells[i]??'');
          o.id=Utils.uid(); ['valorSetup','mensalidade','custo'].forEach(k=>o[k]=+o[k]||0);
          o.tags = o.tags?String(o.tags).split(';').map(t=>t.trim()).filter(Boolean):[];
          if(o.dataFechamento) { const d=new Date(o.dataFechamento); if(!isNaN(d)) o.dataFechamento=d.toISOString(); }
          if(!o.status) o.status='Ativo'; if(!o.tipo) o.tipo='Site';
          if(o.empresa){ Store.get().clientes.push(o); n++; }
        });
        Store.saveNow(); Toast.ok(n+' cliente(s) importado(s)'); render();
      }catch(e){ Toast.err('Falha ao ler o CSV'); } };
      r.readAsText(file); };
    inp.click();
  };
  const parseCSVLine = (line) => { const out=[]; let cur='',q=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"')q=true; else if(ch===','){out.push(cur);cur='';} else cur+=ch; } }
    out.push(cur); return out; };

  return {render};
})();

const Leads = (() => {

          <button class="btn btn-primary" id="lAdd">${IconSet.plus} Novo lead</button>

  const form = (l={}) => {
    const isEdit=!!l.id;
    Modal.open(`
      <div class="modal-h"><h3>${isEdit?'Editar lead':'Novo lead'}</h3><button class="ico" data-x>${IconSet.x}</button></div>
      <div class="modal-b"><form id="lForm"><div class="form-grid">
        <div class="full"><label>Empresa *</label><input class="input" name="empresa" required value="${Utils.esc(l.empresa||'')}"></div>
        <div><label>Contato</label><input class="input" name="contato" value="${Utils.esc(l.contato||'')}"></div>
        <div><label>Telefone</label><input class="input" name="telefone" value="${Utils.esc(l.telefone||'')}"></div>
        <div><label>Email</label><input class="input" type="email" name="email" value="${Utils.esc(l.email||'')}"></div>
        <div><label>Origem</label><select class="input" name="origem">${ORIGENS.map(o=>`<option ${l.origem===o?'selected':''}>${o}</option>`).join('')}</select></div>
        <div><label>Etapa</label><select class="input" name="etapa">${ETAPAS.map(e=>`<option ${l.etapa===e?'selected':''}>${e}</option>`).join('')}</select></div>
        <div><label>Valor estimado (R$)</label><input class="input" type="number" step="0.01" name="valor" value="${l.valor??''}"></div>
        <div><label>Follow-up</label><input class="input" type="date" name="followup" value="${l.followup?l.followup.slice(0,10):''}"></div>
        <div class="full"><label>Tags (vírgula)</label><input class="input" name="tags" value="${Utils.esc((l.tags||[]).join(', '))}"></div>
        <div class="full"><label>Nova nota</label><textarea class="input" name="nota" rows="2" placeholder="Registrar histórico…"></textarea></div>
        ${(l.notas&&l.notas.length)?`<div class="full"><label>Histórico</label><div class="tl">${l.notas.slice().reverse().map(n=>`<div class="row"><div class="dot gray"></div><div><div class="t" style="font-weight:500">${Utils.esc(n.text)}</div><div class="d">${Utils.fmtDate(n.ts)}</div></div></div>`).join('')}</div></div>`:''}
      </div></form></div>
      <div class="modal-f">
        ${isEdit?`<button class="btn btn-danger" id="lDel">Excluir</button>`:''}
        <div class="grow" style="flex:1"></div>
        <button class="btn" data-x>Cancelar</button><button class="btn btn-primary" id="lSave">${isEdit?'Salvar':'Criar lead'}</button>

      o.valor=+o.valor||0; o.followup=o.followup?new Date(o.followup).toISOString():'';
      const nota=o.nota; delete o.nota;
      const db=Store.get();
      if(isEdit){ const t=db.leads.find(x=>x.id===l.id); Object.assign(t,o); if(nota)t.notas.push({ts:new Date().toISOString(),text:nota}); Toast.ok('Lead atualizado'); }
      else { o.id=Utils.uid(); o.criadoEm=new Date().toISOString(); o.notas=nota?[{ts:o.criadoEm,text:nota}]:[]; db.leads.push(o); Toast.ok('Lead criado'); }
      Store.saveNow(); Modal.close(); render();

    Utils.$('#lForm').addEventListener('submit',e=>{e.preventDefault();submit();});
    const del=Utils.$('#lDel'); if(del)del.onclick=async()=>{ if(await Modal.confirm('Excluir lead',`Remover "${l.empresa}"?`,{danger:true,okText:'Excluir'})){const db=Store.get();db.leads=db.leads.filter(x=>x.id!==l.id);Store.saveNow();Modal.close();Toast.ok('Lead excluído');render();}};
  };

  const bind = () => {
    const s=Utils.$('#lSearch'); if(s){s.oninput=Utils.debounce(e=>{q=e.target.value;render();},180);s.focus();s.setSelectionRange(s.value.length,s.value.length);}

      card.onclick=()=>{ if(card.classList.contains('dragging'))return; form(Store.get().leads.find(l=>l.id===card.dataset.id)); };

      card.ondragend=()=>{card.classList.remove('dragging');dragId=null;};
    });
    Utils.$$('.drop').forEach(zone=>{
      zone.ondragover=e=>{e.preventDefault();zone.classList.add('over');};
      zone.ondragleave=()=>zone.classList.remove('over');
      zone.ondrop=e=>{e.preventDefault();zone.classList.remove('over'); if(!dragId)return;
        const l=Store.get().leads.find(x=>x.id===dragId); const et=zone.dataset.etapa;
        if(l && l.etapa!==et){ l.etapa=et; l.notas.push({ts:new Date().toISOString(),text:'Movido para: '+et});

          if(et==='Fechado') Toast.ok('Lead fechado 🎉'); else Toast.info('Movido para '+et);
          Store.saveNow(); render(); }
      };
    });
  };
  return {render};
})();

    Utils.$$('[data-x]').forEach(b=>b.onclick=Modal.close);
    const submit=()=>{const f=Utils.$('#pForm');if(!f.reportValidity())return;const o=Object.fromEntries(new FormData(f).entries());
      o.id=Utils.uid();o.valor=+o.valor||0;o.data=o.data?new Date(o.data).toISOString():new Date().toISOString();
      Store.get().pagamentos.push(o);Store.saveNow();Modal.close();Toast.ok('Lançamento adicionado');render();};
    Utils.$('#pSave').onclick=submit;
    Utils.$('#pForm').addEventListener('submit',e=>{e.preventDefault();submit();});
  };
  return {render};
})();

/* ------------------------------------------------------------------ *
 * CONFIG + BACKUP
 * ------------------------------------------------------------------ */
const Config = (() => {
  const render = () => {
    const c = Store.get().config;
    Utils.$('#view').innerHTML = `
      <div class="fade-in" style="max-width:720px">
        <div class="card">
          <div class="chart-head"><h3>Dados da agência</h3></div>
          <form id="cfgForm"><div class="form-grid">
            <div class="full"><label>Nome da agência</label><input class="input" name="agencia" value="${Utils.esc(c.agencia||'')}"></div>
            <div><label>WhatsApp</label><input class="input" name="whatsapp" value="${Utils.esc(c.whatsapp||'')}"></div>
            <div><label>Email</label><input class="input" name="email" value="${Utils.esc(c.email||'')}"></div>
            <div class="full"><label>Valor padrão de setup (R$)</label><input class="input" type="number" step="0.01" name="setupPadrao" value="${c.setupPadrao??''}"></div>
          </div></form>
          <div style="margin-top:18px"><button class="btn btn-primary" id="cfgSave">Salvar configurações</button></div>
        </div>

        <div class="card" style="margin-top:16px">
          <div class="chart-head"><h3>Backup e dados</h3></div>
          <p class="muted" style="font-size:13.5px;margin:0 0 16px;line-height:1.6">Seus dados ficam salvos apenas neste navegador (LocalStorage). Faça backups com frequência exportando o arquivo JSON.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn" id="bkExport">Exportar backup (JSON)</button>
            <button class="btn" id="bkImport">Restaurar backup</button>
            <button class="btn btn-danger" id="bkClear">Limpar banco</button>
          </div>
        </div>
      </div>`;
    Utils.$('#cfgSave').onclick=()=>{const o=Object.fromEntries(new FormData(Utils.$('#cfgForm')).entries());o.setupPadrao=+o.setupPadrao||0;Object.assign(Store.get().config,o);Store.saveNow();Toast.ok('Configurações salvas');App.refreshChrome();};
    Utils.$('#bkExport').onclick=Backup.exportJSON;
    Utils.$('#bkImport').onclick=Backup.importJSON;
    Utils.$('#bkClear').onclick=async()=>{ if(await Modal.confirm('Limpar banco','Isto apaga TODOS os dados (clientes, leads, financeiro) e deixa o painel vazio. Tem certeza?',{danger:true,okText:'Apagar tudo'})){Store.reset();Toast.ok('Banco limpo');App.go('dashboard');}};
  };
  return {render};
})();

const Backup = (() => {
  const exportJSON = () => { Utils.download('impulsioneai-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(Store.get(),null,2), 'application/json'); Toast.ok('Backup exportado'); };
  const importJSON = () => {
    const inp=Utils.el('input',{type:'file',accept:'.json'});
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
      r.onload=async()=>{ try{ const obj=JSON.parse(r.result);
        if(!obj.clientes||!obj.leads){Toast.err('Arquivo inválido');return;}
        if(await Modal.confirm('Restaurar backup','Isto substitui todos os dados atuais pelos do arquivo. Continuar?',{okText:'Restaurar'})){
          Store.replace(obj); Toast.ok('Backup restaurado'); App.go('dashboard'); }
      }catch(e){Toast.err('JSON inválido');} };
      r.readAsText(f);};
    inp.click();
  };
  const render = () => Config.render(); // "Backup" no menu reaproveita a tela de config focada
  return {exportJSON,importJSON,render};
})();

/* ------------------------------------------------------------------ *
 * APP — autenticação, roteador, chrome (sidebar/topbar), atalhos.
 * ------------------------------------------------------------------ */
const App = (() => {
  const SALT='impulsioneai-admin-2026';
  const USER='empresa';
  const HASH='0ba5e0a13160e5f3f7215893728e255fb32fd4c98f131e82142402a2131e0e73';

  const ROUTES = {
    dashboard:{title:'Dashboard', sub:'Visão geral do negócio', icon:IconSet.dashboard, view:Dashboard},
    clientes :{title:'Clientes', sub:'Sua base de clientes', icon:IconSet.clientes, view:Clientes},
    leads    :{title:'Leads', sub:'Funil de vendas', icon:IconSet.leads, view:Leads},
    financeiro:{title:'Financeiro', sub:'Receitas, custos e fluxo de caixa', icon:IconSet.financeiro, view:Financeiro},
    config   :{title:'Configurações', sub:'Preferências da conta', icon:IconSet.config, view:Config},
    backup   :{title:'Backup', sub:'Exportar, importar e restaurar', icon:IconSet.backup, view:Backup},
  };
  let current='dashboard';

  /* ---- autenticação ---- */
  const initLogin = () => {
    const form=Utils.$('#loginForm'), err=Utils.$('#lgErr');
    form.onsubmit=async e=>{ e.preventDefault();
      const u=Utils.$('#lgUser').value.trim(); const p=Utils.$('#lgPass').value;
      const h=await Utils.sha256(SALT+':'+p);
      if(u.toLowerCase()===USER && h===HASH){ Store.setAuthed(true); enter(); }
      else { err.textContent='Usuário ou senha incorretos.'; Utils.$('#lgPass').value=''; Utils.$('#login .card').animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:220,easing:'ease-out'}); }
    };
  };
  const enter = () => { Utils.$('#login').classList.add('hide'); Utils.$('#app').classList.remove('hide'); buildChrome(); go(location.hash.replace('#','')||'dashboard'); };
  const logout = () => { Store.setAuthed(false); location.reload(); };

  /* ---- chrome (menu lateral + inferior + topbar) ---- */
  const buildChrome = () => {
    const links = Object.entries(ROUTES).map(([k,r])=>`<a href="#${k}" data-route="${k}">${r.icon}<span>${r.title}</span></a>`).join('');
    Utils.$('#navDesk').innerHTML = links;
    // barra inferior mobile: só os 5 principais
    Utils.$('#navMob').innerHTML = Object.entries(ROUTES).filter(([k])=>k!=='backup').map(([k,r])=>`<a href="#${k}" data-route="${k}">${r.icon}<span>${r.title}</span></a>`).join('');
    refreshChrome();
    Utils.$('#btnLogout').onclick=logout;
    // busca global → vai pra clientes filtrando
    const gs=Utils.$('#globalSearch'); gs.addEventListener('keydown',e=>{ if(e.key==='Enter'){ go('clientes'); }});
  };
  const refreshChrome = () => {
    const c=Store.get().config;
    Utils.$('#whoName').textContent=c.agencia||'empresa';
    Utils.$('#avatar').textContent=(c.agencia||'E').trim().charAt(0).toUpperCase();
  };

  /* ---- roteador ---- */
  const go = (route) => {
    if(!ROUTES[route]) route='dashboard';
    current=route; location.hash=route;
    const r=ROUTES[route];
    Utils.$('#pageTitle').textContent=r.title;
    Utils.$('#pageSub').textContent=r.sub;
    Utils.$$('#navDesk a, #navMob a').forEach(a=>a.classList.toggle('active', a.dataset.route===route));
    Utils.$('#view').scrollTop=0; window.scrollTo({top:0});
    r.view.render();
  };

  /* ---- atalhos de teclado ---- */
  const initKeys = () => {
    document.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ if(Utils.$('#overlay').classList.contains('show')) Modal.close(); }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); Store.saveNow(); Toast.ok('Dados salvos'); }
    });
    window.addEventListener('hashchange', ()=>{ const r=location.hash.replace('#',''); if(r && r!==current && Store.isAuthed()) go(r); });
    // autosave periódico
    setInterval(()=>Store.saveNow(), 15000);
    window.addEventListener('beforeunload', ()=>Store.saveNow());
  };

  const init = () => {
    Store.load(); initLogin(); initKeys();
    if(Store.isAuthed()) enter();
  };
  return {init,go,logout,refreshChrome};
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
